<!doctype html>
<html lang="en" data-skin="aurora">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ragnalog{% endblock %}</title>
<script>
(function () {
  /* Settings saved before the rename to ragnalog (0.6.0) move to the new keys once. */
  try { ["report-theme", "skin", "wide", "tz", "drawer-w"].forEach(function (k) { var v = localStorage.getItem("atlas-log-" + k); if (v !== null) { if (localStorage.getItem("ragnalog-" + k) === null) { localStorage.setItem("ragnalog-" + k, v); } localStorage.removeItem("atlas-log-" + k); } }); } catch (e) { /* storage unavailable */ }
  var t = null;
  try { t = localStorage.getItem("ragnalog-report-theme"); } catch (e) { t = null; }
  if (t === "dark" || t === "light") { document.documentElement.setAttribute("data-theme", t); }
  var s = null;
  try { s = localStorage.getItem("ragnalog-skin"); } catch (e) { /* storage unavailable */ }
  if (s === "classic") { document.documentElement.removeAttribute("data-skin"); }
  else { document.documentElement.setAttribute("data-skin", s === "mineral" ? "mineral" : "aurora"); }
  try { if (localStorage.getItem("ragnalog-wide") === "1") { document.documentElement.setAttribute("data-wide", ""); } } catch (e) { /* storage unavailable */ }
})();
</script>
<link rel="stylesheet" href="/assets/report/report.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/static/webapp.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/assets/report/skins.css?v={{ asset_v() }}">
<script defer src="/assets/report/skins.js?v={{ asset_v() }}"></script>
<script defer src="/assets/report/tips.js?v={{ asset_v() }}"></script>
<script defer src="/static/webapp.js?v={{ asset_v() }}"></script>
</head>
<body class="app">
<nav class="crumbs" aria-label="Breadcrumb"><div class="crumb-trail">{{ crumb_root }}{% block nav %}{% endblock %}</div><div class="crumb-end">{% block views %}{% endblock %}</div></nav>
<main class="page">
{% block main %}{% endblock %}
</main>
{% set b = build() %}<footer class="foot muted">ragnalog {{ tool_version }}{% if b.label() %} · <span class="foot-build" title="{{ b.title() }}">{{ b.label() }}</span>{% endif %} · JSON for every page under <a href="/docs">/api</a></footer>
</body>
</html>
