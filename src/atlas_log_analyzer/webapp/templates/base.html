<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}atlas-log{% endblock %}</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("atlas-log-report-theme"); } catch (e) { t = null; }
  if (t === "dark" || t === "light") { document.documentElement.setAttribute("data-theme", t); }
  try { if (localStorage.getItem("atlas-log-wide") === "1") { document.documentElement.setAttribute("data-wide", ""); } } catch (e) { /* storage unavailable */ }
})();
</script>
<link rel="stylesheet" href="/assets/report/report.css">
<link rel="stylesheet" href="/static/webapp.css">
<script defer src="/assets/report/tips.js"></script>
<script defer src="/static/webapp.js"></script>
</head>
<body class="app">
<nav class="crumbs" aria-label="Breadcrumb"><div class="crumb-trail">{{ crumb_root }}{% block nav %}{% endblock %}</div><div class="crumb-end">{% block views %}{% endblock %}</div></nav>
<main class="page">
{% block main %}{% endblock %}
</main>
<footer class="foot muted">atlas-log {{ tool_version }} · JSON for every page under <a href="/docs">/api</a></footer>
</body>
</html>
