# Monthly dependency update pull requests, one grouped PR per ecosystem. CI does not run on
# pull requests (see ci.yml): check a PR locally (AGENTS.md "Commands") or run CI by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    groups:
      images: {patterns: ["*"]}
