name: Release

# Push a tag vX.Y.Z (equal to project.version, with a "## [X.Y.Z]" section in
# CHANGELOG.md): builds the wheel and sdist, publishes a GitHub release with them and
# that section as notes, and pushes the container image to ghcr.io.
# Run it by hand (gh workflow run release.yml -f tag=vX.Y.Z) to finish publishing an
# existing tag: a release that already exists is kept, the image is pushed again.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag vX.Y.Z to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0  # the image's build number is the commit count

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Version and notes
        id: meta
        shell: bash
        run: |
          version="${TAG#v}"
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "$project" ]; then
            echo "tag $TAG does not match project.version $project" >&2
            exit 1
          fi
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build --out-dir dist

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists: kept as it is"
          else
            gh release create "$TAG" dist/* \
              --title "ragnalog ${{ steps.meta.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Set up QEMU (arm64 image)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Container image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.meta.outputs.version }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # OCI metadata as labels of both images and annotations of the index (ghcr shows
          # the index's on the package page); values without commas
          meta=(
            "org.opencontainers.image.title=ragnalog"
            "org.opencontainers.image.description=Atlassian Data Center log analyzer: web app and CLI"
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.licenses=Apache-2.0"
            "org.opencontainers.image.version=$version"
            "org.opencontainers.image.revision=$(git rev-parse HEAD)"
          )
          args=()
          for m in "${meta[@]}"; do args+=(--label "$m" --annotation "index:$m"); done
          # one index of the amd64 and arm64 images, no attestations (ghcr refused to tag an
          # attested index)
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --build-arg RAGNALOG_BUILD_NUMBER="$(git rev-list --count HEAD)" \
            --build-arg RAGNALOG_BUILD_GIT="$(git rev-parse --short=7 HEAD)" \
            "${args[@]}" -t "$image:$version" -t "$image:latest" --push .
