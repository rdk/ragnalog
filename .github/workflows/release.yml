name: Release

# Push a tag vX.Y.Z (equal to project.version, with a "## [X.Y.Z]" section in
# CHANGELOG.md): builds the wheel and sdist, publishes a GitHub release with them and
# that section as notes, and pushes the container image to ghcr.io.
# Run it by hand (gh workflow run release.yml -f tag=vX.Y.Z) to finish publishing an
# existing tag: a release that already exists is kept, the image is pushed again.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag vX.Y.Z to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Version and notes
        id: meta
        shell: bash
        run: |
          version="${TAG#v}"
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "$project" ]; then
            echo "tag $TAG does not match project.version $project" >&2
            exit 1
          fi
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build --out-dir dist

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists: kept as it is"
          else
            gh release create "$TAG" dist/* \
              --title "atlas-log-analyzer ${{ steps.meta.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Container image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # one image manifest, no attestation index
          docker build --provenance=false \
            -t "$image:${{ steps.meta.outputs.version }}" -t "$image:latest" .
          docker push "$image:${{ steps.meta.outputs.version }}"
          docker push "$image:latest"
