name: CI

# Runs on pushes to main and on pull requests (free on a public repository), by hand
# (Actions > CI > Run workflow), and from release.yml before it publishes a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml runs the checks first
    inputs:
      ref:
        description: "The ref to check out (default: the triggering ref)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Report script syntax
        run: |
          node --check src/ragnalog/report/assets/report.js
          node --check src/ragnalog/report/assets/cluster.js

      - name: Tests
        run: uv run pytest

      - name: Slow tests
        if: runner.os == 'Linux'
        run: uv run pytest -m slow

      - name: Wheel smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install "$RUNNER_TEMP"/dist/*.whl
          BIN="$RUNNER_TEMP/smoke/bin"
          "$BIN/ragnalog" --version
          cd "$RUNNER_TEMP"
          "$BIN/ragnalog" --store "$RUNNER_TEMP/store" --quiet ingest \
            "$GITHUB_WORKSPACE/tests/cli/data/mini.log" --name mini > /dev/null
          "$BIN/ragnalog" --store "$RUNNER_TEMP/store" --output json groups mini \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["schema"] == "groups.v1" and d["count"] > 0, d'

  docker:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # the build number is the commit count

      - name: Build
        shell: bash
        run: |
          docker build -t ragnalog:ci --build-arg RAGNALOG_BUILD_NUMBER="$(git rev-list --count HEAD)" \
            --build-arg RAGNALOG_BUILD_GIT="$(git rev-parse --short=7 HEAD)" .

      - name: Smoke test
        shell: bash
        run: |
          docker run --rm ragnalog:ci --version
          docker run --rm ragnalog:ci version | python3 -c 'import json, sys; b = json.load(sys.stdin)["build"]; assert b["source"] == "image" and b["number"] > 0 and b["git"] and b["time"], b'
          docker volume create ragnalog-ci
          docker run --rm -v ragnalog-ci:/data -v "$GITHUB_WORKSPACE/tests/cli/data:/in:ro" \
            ragnalog:ci --quiet ingest /in/mini.log --name mini > /dev/null
          docker run -d --name web -p 8321:8321 -v ragnalog-ci:/data -e RAGNALOG_TOKEN=ci-token ragnalog:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8321/static/webapp.js > /dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8321/api/sets)" = 401
          curl -sf -H "Authorization: Bearer ci-token" http://127.0.0.1:8321/api/sets \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["count"] == 1, d'
          docker logs web 2>&1 | tail -5
          docker rm -f web

      - name: Set up QEMU (arm64 image)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build and run for arm64
        shell: bash
        run: |
          docker build --platform linux/arm64 -t ragnalog:ci-arm64 .
          docker run --rm --platform linux/arm64 ragnalog:ci-arm64 --version
